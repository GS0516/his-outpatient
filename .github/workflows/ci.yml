name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    name: 后端 pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r server/requirements.txt
      - name: pytest
        working-directory: server
        run: pytest -q

  web:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web

  secret-scan:
    name: 明文密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scan
        run: |
          if grep -rIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=legacy \
             -E "(BEGIN (RSA|OPENSSH) PRIVATE KEY|AI_KEY=[A-Za-z0-9]{16,}|JWT_SECRET=[A-Za-z0-9]{16,})" . ; then
            echo "发现疑似明文密钥"; exit 1
          fi
          echo "未发现明文密钥"

  docker:
    name: 构建镜像
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t his-api:ci ./server
      - run: docker build -t his-web:ci ./web

  images:
    name: 构建并推送镜像到 GHCR
    needs: [api, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: 计算小写镜像名
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/his-outpatient" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  # 部署示例：Render / Vercel / 自建服务器关联仓库后自动发布
