<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>工作台外壳冒烟测试</title>
<link rel="stylesheet" href="../assets/css/theme.css">
<link rel="stylesheet" href="../assets/css/console.css">
<style>#report{position:fixed;right:12px;bottom:12px;z-index:9999;background:#fff;border:1px solid #cdd9e8;border-radius:10px;padding:10px 14px;font:12px/1.6 Consolas,monospace;white-space:pre;box-shadow:0 12px 30px -18px rgba(16,42,74,.4)}</style>
</head>
<body class="console">
<div class="shell">
  <aside class="side">
    <a class="side-hd" href="../index.html"><span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg></span><span><span class="t">门诊医生工作站</span><span class="s">HIS · V3</span></span></a>
    <div class="side-search"><div class="search"><input class="input" id="navSearch" placeholder="搜索页面…"></div></div>
    <nav class="side-nav" id="nav"></nav>
    <div class="side-ft">
      <div class="user-chip" id="userChip">
        <span class="av" id="userAv">医</span>
        <span style="min-width:0"><span class="n" id="userName">医生</span><span class="r" id="userRole">doctor</span></span>
        <button class="x-btn" id="btnLogout" title="退出">×</button>
      </div>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="crumb" id="crumb"></div>
      <div class="top-right">
        <button class="btn btn-sm btn-ghost" id="btnReset">重置数据</button>
        <button class="btn btn-sm btn-ghost" id="btnLog">操作日志</button>
        <span class="clock" id="clock">--:--:--</span>
      </div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>
<div id="toasts"></div>
<pre id="report">running…</pre>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/core.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/services.js"></script>
<script src="../assets/js/m/dashboard.js"></script>
<script src="../assets/js/m/clinic.js"></script>
<script>
  /* 冒烟测试：跳过真实登录（守卫另有单元测试），只验证外壳装配 */
  HIS.auth.require = function () { return true; };
</script>
<script src="../assets/js/boot.js"></script>
<script>
(function () {
  var H = window.HIS, out = [], pass = 0, fail = 0;
  function ok(n, c, e) { c ? (pass++, out.push('PASS  ' + n + (e ? '  → ' + e : ''))) : (fail++, out.push('FAIL  ' + n + (e ? '  → ' + e : ''))); }
  window.addEventListener('error', function (e) { out.push('JS ERROR: ' + e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno); render(); });
  setTimeout(function () {
    var nav = document.querySelectorAll('.nav-item');
    ok('侧栏渲染导航项（2 项）', nav.length === 2, nav.length + ' 项');
    ok('导航包含门诊医生工作站', Array.prototype.some.call(nav, function (a) { return a.textContent.indexOf('门诊医生工作站') > -1; }));
    var view = document.getElementById('view');
    ok('默认路由渲染工作台', view.innerHTML.length > 500 && view.textContent.indexOf('工作台总览') > -1, view.innerHTML.length + ' 字符');
    ok('面包屑已填充', (document.getElementById('crumb').textContent || '').indexOf('工作台') > -1);
    ok('时钟已启动', document.getElementById('clock').textContent !== '--:--:--');
    /* 切到门诊站 */
    location.hash = '#/clinic/op';
    setTimeout(function () {
      var v2 = document.getElementById('view');
      ok('路由切换到门诊医生工作站', v2.textContent.indexOf('门诊医生工作站') > -1 && v2.textContent.indexOf('候诊队列') > -1);
      ok('页面无渲染异常', v2.textContent.indexOf('页面渲染异常') === -1);
      render();
    }, 500);
  }, 800);

  function render() {
    document.getElementById('report').textContent = out.join('\n') + '\n合计：' + (pass + fail) + ' 项，通过 ' + pass + '，失败 ' + fail;
  }
})();
</script>
</body>
</html>
