<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作台 · 门诊医生工作站</title>
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/console.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%235de8d2'/%3E%3Cpath d='M12 5v14M5 12h14' stroke='%2304121a' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body class="console">

<div class="shell">
  <!-- ================= 侧栏 ================= -->
  <aside class="side">
    <a class="side-hd" href="index.html">
      <span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg></span>
      <span>
        <span class="t">医院信息系统</span>
        <span class="s">HIS · V2.0</span>
      </span>
    </a>
    <div class="side-search">
      <div class="search">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input class="input" id="navSearch" placeholder="搜索页面…">
      </div>
    </div>
    <nav class="side-nav" id="nav"></nav>
    <div class="side-ft">
      <div class="user-chip" id="userChip">
        <span class="av" id="userAv">陈</span>
        <span style="min-width:0">
          <span class="n" id="userName" style="display:block">陈志远</span>
          <span class="r" id="userRole">医生 · 内科</span>
        </span>
        <button class="x-btn" id="btnLogout" title="退出登录" style="margin-left:auto;width:26px;height:26px">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M15 4h4v16h-4"/><path d="M10 8l-4 4 4 4M6 12h9"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- ================= 主区 ================= -->
  <div class="main">
    <header class="top">
      <div class="crumb" id="crumb"><span>工作台</span><span class="sep">/</span><b>总览</b></div>
      <div class="top-right">
        <button class="btn btn-sm btn-ghost" id="btnReset" title="恢复演示数据">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 6.4"/><path d="M20 4v7h-7"/></svg>
          重置数据
        </button>
        <button class="btn btn-sm btn-ghost" id="btnLog">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
          操作日志
        </button>
        <span class="clock" id="clock">--:--:--</span>
      </div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>

<div id="toasts"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/services.js"></script>
<script src="assets/js/m/dashboard.js"></script>
<script src="assets/js/m/clinic.js"></script>
<script src="assets/js/boot.js"></script>
</body>
</html>
